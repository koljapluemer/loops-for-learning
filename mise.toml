# Developer tools and tasks. After cloning (next to checkouts of gestalts and gestalt-plugins, see README): `mise install`, then
# `mise run dev`.

[tools]
node = "26.12.0"
pnpm = "10.32.1"

[tasks.setup]
description = "The gestalts and gestalt-plugins checkouts next to this one (packages, the core in wasm, plugins), then this app's JS dependencies"
run = [
  "mise -C ../gestalt-plugins run setup",
  "pnpm install",
]

[tasks.dev]
description = "The app on :5174 with hot reload (start the Gestalter's desktop app too, to sync with a folder)"
depends = ["setup"]
run = "pnpm dev"

[tasks.check]
description = "Lints and typechecks"
depends = ["setup"]
run = ["pnpm lint", "pnpm typecheck"]

[tasks.build]
description = "Production build into dist/, static files to host anywhere"
depends = ["setup"]
run = "pnpm build"
